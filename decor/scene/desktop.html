  /* The desktop page (owner, 2026-10-27): nothing but the two downloads, Windows and Mac, on the shop's still decor; no

     button is, a light apple green, its words dark green; the Mac one waits, "coming soon". */
  .entete {
    display: none;
  }

  .telechargements {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    align-content: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    pointer-events: none;
  }

  .telechargements h1 {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .dl {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 250px;
    min-height: 68px;
    box-sizing: border-box;
    padding: 0 30px 0 24px;
    border: 1px solid #7cc24a;
    border-radius: 999px;
    background: #a3e070;
    box-shadow: 0 4px 18px rgb(40 90 20 / 0.28);
    color: #173d0b;
    font: 800 19px/1.15 var(--texte);
    text-decoration: none;
    pointer-events: auto;
    transition: transform 0.38s cubic-bezier(0.3, 1.6, 0.5, 1), background-color 0.2s ease;
  }

  .dl small {
    display: block;
    margin-top: 2px;
    font-size: 12.5px;
    font-weight: 600;
    opacity: 0.8;
  }

  .dl svg {
    flex: none;
  }

  a.dl:hover {
    background: #96d861;
  }

  a.dl:active {
    transform: scale(0.95);
  }

  a.dl:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
  }

  /* Mac: not yet */
  .dl-bientot {
    background: #d6efc2;
    border-color: #b9e09b;
    color: #4a6b3a;
    box-shadow: none;
    cursor: default;
  }

  @media (max-width: 560px) {
    .telechargements {
      flex-direction: column;
    }

    .dl {
      width: min(100%, 320px);
    }
  }
