<!--
  Test bench of the shop scene: the layers of decor/PLAN.md stacked from the horizon to the foreground.
  Static layers are SVG files drawn once by the browser (<img>); only the clouds, the bouquet and the foreground move,
  and only through transforms. Layer files come from decor/out/; a missing one is simply skipped.
  ?debug=1 outlines the phone column and the bouquet slot; ?perf=1 shows frames per second.

  Added for the shop (boutique.js, boutique.css, boutique.json, eclosion.js; no flower engine in the page: the bouquets are
  pre-drawn by predessin.mjs into bouquets/<id>/):
  - .pilier-repere: the pillar's place (x 1100-1300, y 700-1040 of the world), drawn in grey under ?debug=1 only,
    until decor/out/pilier.svg exists;
  - #bouquet: the bouquet of the chosen card, its pre-drawn pieces grown in on the pillar by eclosion.js (plane z8);
  - .cartes: the shelf under the header (soliflores, bouquets sold);
  - .achat: the Buy button for the bouquet on the pillar, fixed at the bottom (the purchase is not wired yet);
  - #perf-bq: the shop's measures under ?perf=1 (also in window.BOUTIQUE_MESURES).
  - the header (dock of icons opening the shelves, OpenSea, About) and the footer (legal notice): entete.js, entete.css;
  - .galerie: one glass frame per bouquet standing on the horizon behind the pillar, the chosen one in the middle, the
    others left and right (a click, a swipe or the arrow keys bring one to the middle); "Open" (.bq-voir) in the middle
    one; the price bubble (.achat) only shows in the close-up;
  - a click on the bouquet or on "Open" brings the camera closer (the whole scene scaled by one transform); a click, Escape or another
    shelf takes it back.
  ?rayon=bouquets|soliflores|vendus|aucun opens that shelf first (default: the bouquets).
  ?b=<product id or index> picks the first bouquet; the card thumbnails (bouquets/<id>/vignette.svg), the foreground and
  the clouds load once it has grown (?vignettes=tot: the thumbnails at once).
-->
<!-- what the page is about, for screen readers and for the crawlers that do not run scripts (the scene says it in

<div class="sr-only">
  <h1>Belai's Garden：有生命的数字花束</h1>
  <p>照着真实花朵一枝一枝绘制的数字花束。每天都有独一无二的新花束，每一束都插在真实的花瓶里，在 Base 上收藏。一束花能活三个月，之后便永远停留在凋谢的模样。借助免费的 Windows 桌面小组件 Belai Bureau，把你的花束摆上电脑桌面。</p>
