<div class="sr-only">
  <h1>Belai's Garden：有生命的数字花束</h1>
  <p>照着真实花朵一枝一枝绘制的数字花束。每天都有独一无二的新花束，每一束都插在真实的花瓶里，在 Base 上收藏。一束花能活三个月，之后便永远停留在凋谢的模样。借助免费的 Windows 桌面小组件 Belai Bureau，把你的花束摆上电脑桌面。</p>
</div>
<noscript>
  <p class="sans-script">这座花园需要 JavaScript 才能让花束绽放。你可以阅读<a href="zh/about.html">关于花束</a>，查看<a href="zh/desktop.html">如何把花束摆上桌面</a>，或阅读<a href="zh/legal.html">法律声明与条款</a>。</p>
</noscript>
<main class="scene" id="scene">
  <div class="monde" id="monde">
    <img class="plan" style="--z:0" data-src="ciel.svg" alt="" decoding="async" fetchpriority="high">
    <div class="plan nuages hauts" style="--z:1" id="nuages-hauts"></div>
    <div class="plan nuages bas" style="--z:2" id="nuages-bas"></div>
    <!-- The catalogue frieze (frise.js, decor/FRISE.md): the horizon and the ground's depth slices as looping strips of
         tiles, each sliding at its own speed as the camera travels, and the 21 pillars between them, laid here at load;
         the bouquets in #bouquet, one plane per place in view, over the whole ground as before. -->
    <div id="frise-ancre" hidden></div>
    <div class="plan bouquet frise-bouquets" style="--z:8" id="bouquet" role="img" aria-label=""></div>
    <!-- the bouquet's place in the world (its manifest's box): a click brings the camera closer (boutique.js) -->
    <button class="bq-cible" id="bq-cible" type="button" aria-pressed="false" aria-label="凑近看看这束花" hidden></button>
    <div class="plan premier" style="--z:9" id="premier"></div>
    <div class="colonne" aria-hidden="true"></div>
  </div>
  <!-- the pager (boutique.js): one dot per bouquet of the day, fixed on the screen by the dock (entete.css) -->
  <div class="pager" id="pager" role="group" aria-label="今日花束" hidden></div>
  <div class="perf" id="perf" hidden></div>
</main>

<!-- the shelf under the header, opened by the dock's icons (entete.js): the soliflores, the bouquets already sold; one
     at a time (the bouquets of the day are the scene itself) -->
<nav class="cartes" id="cartes" aria-label="花架">
  <div class="rayon" data-rayon="soliflores" hidden>
    <p class="rayon-mot">单枝花瓶即将上架：一枝花，配一只花瓶。</p>
  </div>
  <div class="rayon" data-rayon="vendus" hidden>
    <p class="rayon-mot">还没有花束找到它的收藏者。
      <a class="rayon-lien" id="lien-opensea" href="https://opensea.io/" target="_blank" rel="noopener">在 OpenSea 上查看收藏系列</a></p>
  </div>
</nav>

<!-- the close-up's bottom: the wallpaper demo, the Buy button with its price (euros or US dollars by the visitor's
     country) and, under it, the bouquet's lifespan (owner 2026-10-26: no price in crypto shown, the lifespan in the
     button, no resale line); the purchase sheet (the express waiver of the right of withdrawal) opens above the button -->
<div class="achat loin" id="achat" hidden>
  <div class="achat-haut">
    <button class="achat-demo" id="achat-demo" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
      <span>摆上桌面</span>
    </button>
  </div>
  <form class="accord" id="accord" aria-labelledby="accord-titre" hidden>
    <p class="accord-titre" id="accord-titre">付款之前</p>
    <label class="accord-case">
      <input type="checkbox" id="renonce" name="renonce" required>
      <span>我要求立即交付我的花束，并知悉我因此将失去 14 天的撤回权。</span>
    </label>
    <p class="accord-cgv">付款即表示你确认已成年，并接受<a href="zh/legal.html#terms">销售条款</a>。</p>
    <div class="accord-boutons">
      <button class="accord-annuler" id="accord-annuler" type="button">取消</button>
      <button class="accord-payer" id="accord-payer" type="submit">确认并付款</button>
    </div>
  </form>
  <button class="achat-bouton" id="acheter" type="button" aria-controls="accord" aria-expanded="false">
    <span class="achat-ligne">
      <span class="achat-mot" id="achat-mot">购买</span>
      <span class="achat-prix" id="achat-prix" aria-hidden="true"></span>
    </span>
    <span class="achat-vie" id="achat-vie"></span>
  </button>
  <p class="achat-etat" id="achat-etat" role="status" aria-live="polite"></p>
</div>

<!-- the demo video: how to set a bouquet on a computer's desktop with Belai Bureau (videos/fond-ecran.mp4, belai-studio
     lot T10; desktop.html shows it too); if the file is missing the box says so -->
<div class="demo" id="demo" role="dialog" aria-modal="true" aria-labelledby="demo-titre" hidden>
  <div class="demo-boite">
    <div class="demo-tete">
      <h2 id="demo-titre">把你的花束摆上桌面</h2>
      <button class="demo-fermer" id="demo-fermer" type="button" aria-label="关闭视频">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>
    <video class="demo-video" id="demo-video" controls playsinline preload="none" data-src="videos/fond-ecran.mp4"></video>
    <p class="demo-absente" id="demo-absente" hidden>视频即将上线：它会演示如何把花束摆上你的电脑桌面。</p>
  </div>
</div>

<pre class="perf perf-bq" id="perf-bq" hidden></pre>

<script src="scene.js"></script>
<script src="eclosion.js" defer></script>
<script src="entete.js" defer></script>
<script src="frise.js" defer></script>
<script src="boutique.js" defer></script>
<script type="module" src="insectes.mjs"></script>
<script type="module" src="porteuses.mjs"></script>
</body>
</html>
