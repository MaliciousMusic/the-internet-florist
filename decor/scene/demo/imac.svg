<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160">
  <!-- A colourful all-in-one computer seen from the front (demo "On your desktop", owner 2026-10-27: realistic, from
       reference drawings of the 24-inch kind, no logo), in its measured proportions: the body 0.685 of its width high, a thin
       off-white bezel (2.6 % of the width), the pastel chin (10 %), a straight stand a quarter of the width, its foot a thin
       edge. The colours are the custom properties teinte (chin), teinte-bas (chin's foot) and teinte-fonce (stand's sides,
       body's edge) of the element it is inlined in; blue by default. The screen is a hole (x 184, y 64, 1232 x 693,
       radius 3). -->
  <defs>
    <linearGradient id="menton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--teinte, #b8d3ee)"/>
      <stop offset="1" stop-color="var(--teinte-bas, #9ec0e3)"/>
    </linearGradient>
    <linearGradient id="pied" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teinte-fonce, #6f9dcc)"/>
      <stop offset="0.12" stop-color="var(--teinte-bas, #9ec0e3)"/>
      <stop offset="0.5" stop-color="var(--teinte, #b8d3ee)"/>
      <stop offset="0.88" stop-color="var(--teinte-bas, #9ec0e3)"/>
      <stop offset="1" stop-color="var(--teinte-fonce, #6f9dcc)"/>
    </linearGradient>
    <linearGradient id="pied-ombre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="0.25" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lunette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f8"/>
      <stop offset="1" stop-color="#eeeff1"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="0.36" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.37" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ombre" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b1a33" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b1a33" stop-opacity="0"/>
    </radialGradient>
    <mask id="croque" maskUnits="userSpaceOnUse" x="0" y="0" width="56" height="60">
      <rect width="56" height="60" fill="#fff"/>
      <circle cx="49" cy="30" r="8.5" fill="#000"/>
      <circle cx="44.6" cy="21.4" r="3.4" fill="#000"/>
      <circle cx="45.4" cy="38.8" r="3.2" fill="#000"/>
      <!-- its seeds, small, showing the chin a little -->
      <g fill="#000" opacity="0.35"><ellipse cx="20" cy="26" rx="1.1" ry="1.7"/><ellipse cx="28" cy="24" rx="1.1" ry="1.7"/><ellipse cx="36" cy="27" rx="1.1" ry="1.7"/>
        <ellipse cx="17" cy="34" rx="1.1" ry="1.7"/><ellipse cx="25" cy="33" rx="1.1" ry="1.7"/><ellipse cx="33" cy="35" rx="1.1" ry="1.7"/>
        <ellipse cx="21" cy="41" rx="1.1" ry="1.7"/><ellipse cx="29" cy="43" rx="1.1" ry="1.7"/></g>
    </mask>
    <mask id="trou" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <rect width="100%" height="100%" fill="#fff"/>
      <rect x="184" y="64" width="1232" height="693" rx="3" fill="#000"/>
    </mask>
  </defs>

  <ellipse cx="800" cy="1118" rx="360" ry="16" fill="url(#ombre)"/>

  <g mask="url(#trou)">
    <!-- the stand: a bent plate seen from the front, straight, its foot a thin edge; the body's shadow at its top -->
    <rect x="641" y="916" width="318" height="192" fill="url(#pied)"/>
    <rect x="641" y="916" width="318" height="192" fill="url(#pied-ombre)"/>
    <rect x="636" y="1104" width="328" height="7" rx="3" fill="var(--teinte-fonce, #6f9dcc)"/>

    <!-- the body: its coloured edge just showing, the off-white bezel round the screen, the pastel chin -->
    <rect x="148" y="28" width="1304" height="895" rx="18" fill="var(--teinte-fonce, #6f9dcc)"/>
    <path fill="url(#lunette)" d="M168 30h1264a16 16 0 0 1 16 16v745H152V46a16 16 0 0 1 16-16z"/>
    <path fill="url(#menton)" d="M152 791h1296v112a16 16 0 0 1-16 16H168a16 16 0 0 1-16-16z"/>
    <!-- a faint line where the bezel meets the chin -->
    <rect x="152" y="790" width="1296" height="1.5" fill="#000" opacity="0.05"/>
    <!-- on the chin, our mark: a stylised strawberry with a bite out of its right side (owner, 2026-10-27), in the chin's
         darker tint -->
    <g transform="translate(765 818) scale(1.25)" fill="var(--teinte-fonce, #6f9dcc)" opacity="0.7">
      <path mask="url(#croque)" d="M28 14c10.4 0 18 5.6 18 14.2 0 10.6-9.6 20-18 25.8C19.6 48.2 10 38.8 10 28.2 10 19.6 17.6 14 28 14z"/>
      <path d="M28 16.5 20 9.6l6.2 1.6L28 4.6l1.8 6.6 6.2-1.6z"/>
    </g>
    <!-- the camera in the bezel -->
    <circle cx="800" cy="47" r="4.5" fill="#2a2f36"/>
    <circle cx="799" cy="46" r="1.3" fill="#7f9bbd"/>
  </g>

  <!-- the screen's glass -->
  <rect x="184" y="64" width="1232" height="693" rx="3" fill="url(#reflet)" pointer-events="none"/>
</svg>
