<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu du cycle</title>
<style>
  :root { --fond: #3d6f8e; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: #fff; font: 600 14px system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  canvas { height: min(88vh, 960px); }
  #barre { position: fixed; left: 12px; top: 10px; display: flex; gap: 12px; align-items: center; }
  button { font: inherit; padding: 4px 10px; }
</style>
</head>
<body>
<div id="barre"><button id="jouer">Jouer</button><span id="t">0,0 s</span><label>Fond <input id="fond" type="color" value="#3d6f8e"></label></div>
<canvas id="c"></canvas>
<video id="v" muted playsinline preload="auto" crossorigin="anonymous" style="display:none"></video>
<script>
// Preview of a baked cycle (decor/cycle_cuisson.mjs): the stacked-alpha MP4 (premultiplied colour on top, alpha as grey below) put back
// together on a WebGL canvas, over a plain desktop colour. ?src=<url of cycle.mp4> (default ./cycle.mp4). The essai (C3) does the same.
const Q = new URLSearchParams(location.search);
const v = document.getElementById('v'), c = document.getElementById('c'), t = document.getElementById('t');
v.src = Q.get('src') || 'cycle.mp4';
const gl = c.getContext('webgl', { premultipliedAlpha: true, alpha: true });
const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}'));
// the colour from the upper half, the alpha from the lower half's grey (already premultiplied: output as is)
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, 'precision mediump float;varying vec2 uv;uniform sampler2D tx;void main(){vec3 col=texture2D(tx,vec2(uv.x,uv.y*.5)).rgb;float a=texture2D(tx,vec2(uv.x,.5+uv.y*.5)).r;gl_FragColor=vec4(min(col,vec3(a)),a);}'));
gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
for (const [k, val] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, val);
function draw() {
  if (v.readyState >= 2) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, v);
    gl.viewport(0, 0, c.width, c.height); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    t.textContent = v.currentTime.toFixed(1).replace('.', ',') + ' s';
  }
  requestAnimationFrame(draw);
}
v.addEventListener('loadedmetadata', () => { c.width = v.videoWidth; c.height = v.videoHeight / 2; });
document.getElementById('jouer').onclick = () => { v.currentTime = 0; v.play(); };
document.getElementById('fond').oninput = (e) => document.documentElement.style.setProperty('--fond', e.target.value);
// ?t=<seconds>: stop on that moment (to look at one frame)
v.addEventListener('loadeddata', () => { if (Q.get('t')) v.currentTime = +Q.get('t'); });
requestAnimationFrame(draw);
</script>
</body>
</html>
