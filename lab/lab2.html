<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Atelier</title>
<style>body{margin:0;background:#e9e3da;font-family:system-ui}#w{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:0}
.c{position:relative;background:linear-gradient(#efe9e1,#e4ddd2);border:1px solid #d8d0c4}.c svg{display:block;width:100%;height:auto}.c b{position:absolute;left:8px;top:6px;font:600 12px system-ui;color:#5a4a40}</style></head>
<body><svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg><div id="w"></div><script>
const RM=true;function finished(){}
/* ---------- core helpers ---------- */
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function E(t,a,p){const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const G=(p,a)=>E('g',a,p);
let seed=11;
function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
const R=(a,b)=>a+(b-a)*rnd();
const pick=a=>a[Math.floor(rnd()*a.length)];
const MR=(a,b)=>a+(b-a)*Math.random();
const f=n=>Math.round(n*10)/10;
const D=Math.PI/180;

/* ---------- gradients (cached) ---------- */
const defs=$('defs');let gid=0;const gc={};
function stops(g,s){s.forEach((c,i)=>{const o=Array.isArray(c)?c:[i/(s.length-1),c];E('stop',{offset:o[0],'stop-color':o[1],'stop-opacity':o[2]??1},g)})}
function lin(s,x1=0,y1=1,x2=0,y2=0){const k='l'+JSON.stringify(s)+[x1,y1,x2,y2];if(gc[k])return gc[k];const id='g'+(gid++);stops(E('linearGradient',{id,x1,y1,x2,y2},defs),s);return gc[k]=`url(#${id})`}
function rad(s,cx=.5,cy=.5,r=.5,fx=cx,fy=cy){const k='r'+JSON.stringify(s)+[cx,cy,r,fx,fy];if(gc[k])return gc[k];const id='g'+(gid++);stops(E('radialGradient',{id,cx,cy,r,fx,fy},defs),s);return gc[k]=`url(#${id})`}
function radU(s,r){const k='u'+JSON.stringify(s)+r;if(gc[k])return gc[k];const id='g'+(gid++);stops(E('radialGradient',{id,cx:0,cy:0,r,gradientUnits:'userSpaceOnUse'},defs),s);return gc[k]=`url(#${id})`}

/* ---------- geometry ---------- */
function bz(P,t){const u=1-t;return[u*u*u*P[0][0]+3*u*u*t*P[1][0]+3*u*t*t*P[2][0]+t*t*t*P[3][0],u*u*u*P[0][1]+3*u*u*t*P[1][1]+3*u*t*t*P[2][1]+t*t*t*P[3][1]]}
/* filled ribbon along a cubic bezier, half-width wf(t) */
function taper(P,wf,n=20){const A=[],B=[];for(let i=0;i<=n;i++){const t=i/n,p=bz(P,t),q=bz(P,Math.min(1,t+.02)),o=bz(P,Math.max(0,t-.02));const dx=q[0]-o[0],dy=q[1]-o[1],l=Math.hypot(dx,dy)||1,w=typeof wf=='function'?wf(t):wf*(1-t);A.push(f(p[0]-dy/l*w)+','+f(p[1]+dx/l*w));B.push(f(p[0]+dy/l*w)+','+f(p[1]-dx/l*w))}return'M'+A.join('L')+'L'+B.reverse().join('L')+'Z'}
const cp=P=>`M${f(P[0][0])},${f(P[0][1])}C${f(P[1][0])},${f(P[1][1])} ${f(P[2][0])},${f(P[2][1])} ${f(P[3][0])},${f(P[3][1])}`;
/* petals: base at 0,0 pointing up */
const pet=(l,w,r=.6,b=.15)=>`M0,0C${f(w*.9)},${f(-l*b)} ${f(w*1.05)},${f(-l*r)} 0,${f(-l)}C${f(-w*1.05)},${f(-l*r)} ${f(-w*.9)},${f(-l*b)} 0,0Z`;
const rpet=(l,w)=>`M0,0C${f(w*1.3)},${f(-l*.12)} ${f(w*1.25)},${f(-l*1.05)} 0,${f(-l)}C${f(-w*1.25)},${f(-l*1.05)} ${f(-w*1.3)},${f(-l*.12)} 0,0Z`;

/* ---------- timeline engine ---------- */
const tw=[];let T0=0,running=false;
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eb=t=>{const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function tween(t0,d,fn,e=eo){const w={t0,d,fn,e};tw.push(w);fn(0,0);return w}
function tick(now){if(T0<0)T0=now;const t=now-T0;let act=false;for(const w of tw){if(w.done)continue;if(t<w.t0){act=true;continue}const p=Math.min(1,(t-w.t0)/w.d);w.fn(w.e(p),p);if(p>=1)w.done=true;else act=true}if(act)requestAnimationFrame(tick);else{running=false;finished()}}
function play(){tw.forEach(w=>{w.done=false;w.fn(0,0)});T0=-1;if(!running){running=true;requestAnimationFrame(tick)}}
const tr=(x,y,r,s)=>`translate(${f(x)},${f(y)}) rotate(${f(r)}) scale(${Math.max(s,.0001).toFixed(4)})`;
/* whole flower appears at x,y */
function bloom(el,x,y,r,s,t0,d=1200,spin=-25){tween(t0,d,(e,p)=>el.setAttribute('transform',tr(x,y,r+spin*(1-eo(p)),s*e)),eb);idleAdd({el,k:0,x,y,r,s,a:R(1.2,2.4),b:R(.01,.025)})}
/* inner layer unfolds around its local origin */
function open(el,t0,d=900,spin=20,from=.25){tween(t0,d,(e,p)=>el.setAttribute('transform',`rotate(${f(spin*(1-eo(p)))}) scale(${(from+(1-from)*e).toFixed(4)})`),eb);idleAdd({el,k:1,a:R(2,4.5),b:R(.012,.035)})}

/* ---------- idle life once everything has bloomed ---------- */
let IA=1;const idle=[];let idleOn=false,idleT0=0,idleLast=0;
function idleAdd(m){m.a*=IA;m.b*=Math.min(IA,1.2);m.w=R(.00065,.0012);m.p=R(0,6.283);idle.push(m)}
function idleTick(now){if(!idleOn)return;requestAnimationFrame(idleTick);if(now-idleLast<30)return;idleLast=now;const t=now-idleT0,ramp=Math.min(1,t/2500);
  for(const m of idle){const s1=Math.sin(t*m.w+m.p)*ramp,s2=Math.sin(t*m.w*1.6+m.p*1.7)*ramp;
    m.el.setAttribute('transform',m.k?`rotate(${(m.a*s1).toFixed(2)}) scale(${(1+m.b*s2).toFixed(4)})`:`translate(${f(m.x)},${f(m.y)}) rotate(${(m.r+m.a*s1).toFixed(2)}) scale(${(m.s*(1+m.b*s2)).toFixed(4)})`)}}
function startIdle(){if(RM||idleOn)return;idleOn=true;idleT0=performance.now();idleLast=0;requestAnimationFrame(idleTick)}
/* stroke draws itself */
function grow(el,t0,d=900){const L=Math.ceil(el.getTotalLength())+2;el.setAttribute('stroke-dasharray',L+' '+L);tween(t0,d,e=>el.setAttribute('stroke-dashoffset',f(L*(1-e))),eio)}
function fade(el,t0,d=800,dy=20){tween(t0,d,e=>{el.setAttribute('opacity',e.toFixed(3));el.setAttribute('transform',`translate(0,${f(dy*(1-e))})`)})}

/* ================= botanical art kit ================= */
/* closed / open Catmull-Rom through points -> smooth organic cubic path */
function smooth(P,closed=true){const n=P.length;let d=`M${f(P[0][0])},${f(P[0][1])}`;const g=i=>closed?P[(i+n)%n]:P[Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)},${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)},${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])},${f(p2[1])}`}
  return d+(closed?'Z':'')}
const sinP=(pw,a=.05)=>t=>Math.pow(Math.sin(Math.PI*Math.min(.97,a+(1-a)*t)),pw);
/* organic petal / leaf outline pointing up (-y), base at 0,0 */
function petalD(L,W,o={}){const n=o.n||10,rf=o.rf||0,rk=o.rk||8,bend=(o.bend||0)*L,ph=[R(0,6.3),R(0,6.3)],prof=o.prof||sinP(o.pw||.75);
  const side=s=>{const a=[];for(let i=1;i<n;i++){const t=i/n,w=W*prof(t)*(1+(o.asym||0)*s)*(1+rf*t*Math.sin(t*rk*Math.PI+ph[s>0?0:1])+.035*Math.sin(t*5.3+ph[1]));a.push([s*w+bend*t*t,-L*t])}return a};
  const wt=W*prof(.97),tp=o.tip||'round';let tip;
  if(tp==='point')tip=[[bend+wt*.32,-L*.985],[bend,-L*1.03],[bend-wt*.32,-L*.985]];
  else if(tp==='notch')tip=[[bend+wt*.85,-L*.97],[bend+wt*.55,-L*1.0],[bend+wt*.27,-L*.94],[bend,-L*1.01],[bend-wt*.27,-L*.94],[bend-wt*.55,-L*1.0],[bend-wt*.85,-L*.97]];
  else tip=[[bend+wt*.62,-L*.99],[bend,-L*1.03],[bend-wt*.62,-L*.99]];
  return smooth([[0,0],...side(1),...tip,...side(-1).reverse()])}
function veins(g,L,W,c,n,op,sw=.6){for(let k=0;k<n;k++){const u=n===1?0:k/(n-1)*2-1,x=u*W*.55;E('path',{d:`M${f(u*W*.08)},${f(-L*.05)}Q${f(x*.75)},${f(-L*.45)} ${f(x*.92)},${f(-L*.86)}`,stroke:c,'stroke-width':sw,'stroke-opacity':op,fill:'none','stroke-linecap':'round'},g)}}
function specks(g,L,W,o){const c=o.c||'#b3122e';for(let i=0;i<(o.n||20);i++){const t=Math.pow(rnd(),o.p||1.4)*.72+.06,w=W*.5*(1-t*.35),x=R(-w,w),y=-L*t,s=R(.6,1.6)*(o.s||1)*(1-t*.45);
  E('ellipse',{cx:f(x),cy:f(y),rx:f(s*.7),ry:f(s*1.7),fill:c,opacity:f(R(.55,.95)),transform:`rotate(${f(x*.9)} ${f(x)} ${f(y)})`},g)}}
/* painted petal: body gradient, side shading, base shadow, veins, speckles, ink edge. pal=[base,mid,tip,ink] */
function P2(par,L,W,pal,o={}){const g=G(par,o.tr?{transform:o.tr}:null),d=petalD(L,W,o);
  E('path',{d,fill:lin([[0,pal[0]],[.5,pal[1]],[1,pal[2]]],0,1,0,0)},g);
  if(!o.lite){E('path',{d,fill:lin([[0,'#1a0010',o.sh??.24],[.42,'#1a0010',0],[.62,'#ffffff',0],[1,'#ffffff',o.hl??.2]],0,0,1,0)},g);
    if(o.base!==0)E('path',{d,fill:lin([[0,pal[3],o.base??.35],[.32,pal[3],0]],0,1,0,0)},g);
    if(o.v)veins(g,L,W,o.vc||pal[3],o.v,o.vo??.3);if(o.sp)specks(g,L,W,o.sp)}
  E('path',{d,fill:'none',stroke:pal[3],'stroke-width':o.sw??.8,'stroke-opacity':o.so??.5,'stroke-linejoin':'round'},g);return g}
/* composite disc of florets (cosmos, daisy) */
function disc(par,r,c,n){const g=G(par);E('circle',{r,fill:rad([c[0],c[1],c[2]],.42,.38,.7)},g);
  for(let i=0;i<n;i++){const q=Math.sqrt((i+.5)/n)*r*.82,a=i*137.5*D;E('circle',{cx:f(Math.cos(a)*q),cy:f(Math.sin(a)*q),r:f(r*.14*(1.1-q/r*.5)),fill:c[i%3?1:0],stroke:c[2],'stroke-width':.4,'stroke-opacity':.6},g)}
  E('circle',{r,fill:'none',stroke:c[2],'stroke-width':.8,'stroke-opacity':.5},g);return g}

/* ---------- foliage ---------- */
const GP={deep:['#0c3328','#1d5c45','#3f8a5f','#06201a','#9fd3a8'],mid:['#1f5a2c','#3f8f3f','#8fcf6a','#123a1a','#c8f0a0'],light:['#3f7a2a','#7fb84a','#c8e07a','#24461a','#eef9c8'],teal:['#0b3836','#1c6658','#3d8f7a','#04201d','#d8f5ec']};
function leafPaint(g,L,W,pal,o={}){const d=petalD(L,W,Object.assign({n:12,tip:'point',rf:.02,rk:5},o)),bend=o.bend||0;
  E('path',{d,fill:lin([[0,pal[0]],[.55,pal[1]],[1,pal[2]]],0,1,.35,0)},g);
  E('path',{d,fill:lin([[0,'#000',.3],[.47,'#000',0],[.53,'#fff',0],[1,'#fff',.12]],0,0,1,0)},g);
  const prof=o.prof||sinP(.75),nv=o.nv??7;
  for(let i=1;i<=nv;i++){const t=i/(nv+1),y=-L*t,w=W*prof(t)*.86,cx=bend*L*t*t;for(const s of[-1,1])E('path',{d:`M${f(cx)},${f(y)}Q${f(cx+s*w*.5)},${f(y-L*.03)} ${f(cx+s*w)},${f(y-L*(o.va??.12))}`,stroke:pal[4],'stroke-width':o.vw??1,'stroke-opacity':o.vo??.45,fill:'none','stroke-linecap':'round'},g)}
  E('path',{d:taper([[0,0],[bend*L*.12,-L*.35],[bend*L*.49,-L*.7],[bend*L*.94,-L*.97]],u=>Math.max(.35,(o.mr||2.2)*(1-u)),10),fill:pal[4],opacity:.75},g);
  E('path',{d,fill:'none',stroke:pal[3],'stroke-width':o.sw??1,'stroke-opacity':o.so??.75},g);
  if(o.drops)for(let i=0;i<o.drops;i++){const t=R(.2,.8),x=bend*L*t*t+R(-W*.25,W*.25),y=-L*t;E('ellipse',{cx:f(x),cy:f(y),rx:1.7,ry:2.3,fill:'#fff',opacity:.4},g);E('ellipse',{cx:f(x+.5),cy:f(y-.6),rx:.7,ry:.9,fill:'#fff',opacity:.9},g)}
  return d}
function cuts(g,L,W,prof,n){for(let i=1;i<=n;i++){const t=.22+i*.12;for(const s of[-1,1]){const w=W*prof(t),y=-L*t;E('path',{d:`M${f(s*w*1.04)},${f(y+1)}Q${f(s*w*.7)},${f(y-L*.012)} ${f(s*w*.5)},${f(y-L*.018)}Q${f(s*w*.72)},${f(y-L*.03)} ${f(s*w*1.04)},${f(y-L*.032)}Z`,fill:'#0b2a1f'},g)}}
  for(let i=0;i<3;i++){const t=.34+i*.17,s=i%2?1:-1,x=s*W*.26,y=-L*t;E('ellipse',{cx:f(x),cy:f(y),rx:3,ry:6.5,fill:'#0b2a1f',transform:`rotate(${s*28} ${f(x)} ${f(y)})`},g)}}
function tears(g,L,W,prof,n){for(let i=0;i<n;i++){const t=R(.2,.85),s=rnd()<.5?-1:1,w=W*prof(t),y=-L*t;E('path',{d:`M${f(s*w*1.06)},${f(y+1)}L${f(s*w*.12)},${f(y-1)}L${f(s*w*1.06)},${f(y-4)}Z`,fill:'#24461a',opacity:.75},g)}}
function fern(g,L,pal){const P=[[0,0],[R(-15,15),-L*.35],[R(-25,25),-L*.7],[R(-40,40),-L]];E('path',{d:cp(P),stroke:pal[3],'stroke-width':2,fill:'none'},g);const n=20;
  for(let i=1;i<=n;i++){const u=i/(n+1),q=bz(P,u),q2=bz(P,Math.min(1,u+.02)),ang=Math.atan2(q2[1]-q[1],q2[0]-q[0])/D+90,l=L*.2*(1-u*.72),w=l*.24;
    for(const s of[-1,1])E('path',{d:petalD(l,w,{n:6,tip:'point',prof:sinP(.6)}),fill:lin([pal[0],pal[1],pal[2]],0,1,0,0),stroke:pal[3],'stroke-width':.6,'stroke-opacity':.6,transform:`translate(${f(q[0])},${f(q[1])}) rotate(${f(ang+s*62)})`},g)}}
const PA={alocasia:sinP(.7,.24),monstera:sinP(.6,.2),banana:sinP(.35),round:sinP(.5,.08),strap:sinP(.3,.02),stem:sinP(.75)};
const FOL={
 alocasia:g=>leafPaint(g,170,62,GP.teal,{prof:PA.alocasia,nv:6,va:.18,vw:2,vo:.85,mr:3.2,bend:R(-.1,.1)}),
 monstera:g=>{leafPaint(g,160,80,GP.deep,{prof:PA.monstera,nv:6,va:.1,vw:1.4,vo:.5,mr:3});cuts(g,160,80,PA.monstera,5)},
 banana:g=>{leafPaint(g,260,46,GP.light,{prof:PA.banana,nv:22,va:.015,vw:.7,vo:.4,mr:3.6,bend:R(-.12,.12)});tears(g,260,46,PA.banana,4)},
 round:g=>leafPaint(g,120,70,GP.light,{prof:PA.round,nv:5,va:.14,vw:1.2,vo:.5,mr:2.4,tip:'round'}),
 fern:g=>fern(g,200,GP.mid),
 strap:g=>leafPaint(g,190,13,GP.mid,{prof:PA.strap,nv:0,mr:1.2,bend:R(-.35,.35),drops:3}),
 stem:g=>leafPaint(g,70,15,GP.mid,{prof:PA.stem,nv:4,va:.1,vw:.7,vo:.4,mr:1.2,bend:R(-.25,.25)})};
/* flat dark silhouettes for the far layer */
const FARC=[['#173f36','#22574a'],['#1a4a3e','#2b6a55'],['#1f5546','#33785c'],['#163a33','#245244'],['#24584a','#3a7f62']];
function silh(g,tp){const c=pick(FARC);let L=170,W=62,o={prof:PA.alocasia};if(tp==='monstera'){L=160;W=80;o={prof:PA.monstera}}if(tp==='banana'){L=260;W=46;o={prof:PA.banana}}if(tp==='round'){L=120;W=70;o={prof:PA.round,tip:'round'}}
  E('path',{d:petalD(L,W,Object.assign({n:10,tip:'point'},o)),fill:lin([c[0],c[1]],0,1,.4,0)},g);E('path',{d:`M0,0L0,${-L*.95}`,stroke:'#4f9a7c','stroke-width':1.4,'stroke-opacity':.35},g)}

/* ================= Atelier v3 — high-detail botanical kit ================= */
/* colour maths */
const hx=c=>{const n=parseInt(c.slice(1,7),16);return[n>>16&255,n>>8&255,n&255]};
const hs=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return hs(A.map((v,i)=>v+(B[i]-v)*t))};
const dk=(c,t)=>mix(c,'#0d0408',t),lt=(c,t)=>mix(c,'#fffaf4',t);
/* five tones from one colour: ink, shadow, body, light, rim */
const tones=(c,k=1)=>[mix(dk(c,.82),'#1a0610',.25),dk(c,.36*k),c,lt(c,.3*k),lt(c,.66)];
/* attribute bag without empty values */
const AT=o=>{for(const k in o)if(o[k]==null)delete o[k];return o};

/* fine veins that follow the petal's own width profile (no clipping needed) */
function veinD(L,W,o={}){const n=o.vn||9,prof=o.prof||sinP(o.pw||.75),bend=(o.bend||0)*L,sp=o.spread??.8,len=o.vl??.88;let d='';
  for(let k=0;k<n;k++){const u=n===1?0:k/(n-1)*2-1,e=len*(1-.28*u*u)*R(.82,1.02),P=[];
    for(let i=0;i<=5;i++){const t=.03+e*i/5;P.push([u*W*prof(Math.min(.97,t))*sp+bend*t*t,-L*t])}d+=smooth(P,false)}return d}
/* painted petal v3: body, curvature, base shadow, veins, speckles, translucent rim, ink edge. cs=tones() */
function pp(par,L,W,cs,o={}){const g=G(par,AT({transform:o.tr})),d=o.d||petalD(L,W,o),sh=o.sh??1;
  E('path',{d,fill:lin([[0,o.bc||cs[1]],[o.mp??.42,cs[2]],[1,o.tc||cs[3]]],0,1,0,0)},g);
  if((o.cup??1)>0)E('path',{d,fill:lin([[0,cs[0],.32*sh],[.27,cs[0],0],[.52,'#fff',0],[.7,'#fff',.13*sh],[1,cs[0],.2*sh]],0,0,1,0)},g);
  else E('path',{d,fill:lin([[0,'#fff',.2*sh],[.24,'#fff',0],[.6,cs[0],0],[1,cs[0],.34*sh]],0,0,1,0)},g);
  if(o.base!==0)E('path',{d,fill:lin([[0,o.bk||cs[0],o.base??.5],[o.bl??.34,o.bk||cs[0],0]],0,1,0,0)},g);
  if(o.v)E('path',{d:veinD(L,W,{vn:o.v,prof:o.prof,pw:o.pw,bend:o.bend,spread:o.spread,vl:o.vl}),stroke:o.vc||cs[0],'stroke-width':o.vw??.45,'stroke-opacity':o.vo??.2,fill:'none','stroke-linecap':'round'},g);
  if(o.sp)specks(g,L,W,o.sp);
  if(o.rim!==0)E('path',{d,fill:'none',stroke:lin([[0,cs[4],0],[o.rs??.5,cs[4],0],[1,cs[4],o.rim??.7]],0,1,0,0),'stroke-width':o.rw??1.1},g);
  E('path',{d,fill:'none',stroke:cs[0],'stroke-width':o.sw??.5,'stroke-opacity':o.so??.5,'stroke-linejoin':'round'},g);return g}
/* specular highlight and soft contact shadow */
function glint(par,x,y,rx,ry,rot,op=.55){return E('ellipse',AT({cx:f(x),cy:f(y),rx:f(rx),ry:f(ry),fill:rad([[0,'#fff',op],[.55,'#fff',op*.3],[1,'#fff',0]]),transform:rot?`rotate(${f(rot)} ${f(x)} ${f(y)})`:null}),par)}
function ao(par,x,y,rx,ry,op=.35,c='#140608'){return E('ellipse',{cx:f(x),cy:f(y),rx:f(rx),ry:f(ry),fill:rad([[0,c,op],[.5,c,op*.55],[1,c,0]])},par)}

  E('path',{d:`M${f(-r*.13)},${f(r*.5)}C${f(-r*.05)},${f(r*.57)} ${f(r*.05)},${f(r*.57)} ${f(r*.13)},${f(r*.5)}`,stroke:lt(lp[1],.4),'stroke-width':1.6,'stroke-opacity':.9,fill:'none','stroke-linecap':'round'},L);

/* ================= Atelier v3 — rose de jardin, renoncule, dahlia, œillet ================= */
/* ring of cupped petal edges around the centre (seen from above), local -y points outward */
function cring(par,r,n,w,h,cols,a0,o={}){for(let i=0;i<n;i++){const a=a0+i*360/n+R(-9,9),x=Math.cos(a*D)*r,y=Math.sin(a*D)*r;
  cresc(par,w*R(.86,1.1),h*R(.85,1.15),cols,{tr:`translate(${f(x)},${f(y)}) rotate(${f(a+90)})`,th:o.th,rim:o.rim,rw:o.rw})}}
const deepen=(c,dp,k)=>[mix(c[1],dp,k),mix(c[2],dp,k*.6),mix(c[3],c[2],k*.7),lt(c[4],.15)];

/* ---------- garden rose (David Austin type): broad guard petals, deep cup, quartered heart ---------- */
function xRose(g,t,o){const c=o.c||tones('#f2c6b6'),Rr=o.R||40,k=G(g),dp=o.deep||dk(c[1],.35);
  const gp={prof:sinP(.42,.12),tip:'round',rf:.035,rk:3,cup:-1,sh:.9,base:.55,bl:.44,v:7,vo:.12,vw:.4,rim:.85,rs:.55,rw:1.4,so:.4};
  for(let i=0;i<6;i++)pp(k,Rr*1.02,Rr*.56,c,Object.assign({},gp,{tr:`rotate(${f(i*60+R(-10,10))})`,asym:R(-.1,.1)}));
  for(let i=0;i<6;i++)pp(k,Rr*.86,Rr*.5,c,Object.assign({},gp,{tr:`rotate(${f(i*60+30+R(-10,10))})`,asym:R(-.1,.1)}));
  E('circle',{r:f(Rr*.66),fill:rad([[0,dp],[.62,mix(dp,c[1],.55)],[1,c[1],0]])},k);
  cring(k,Rr*.6,8,Rr*.37,Rr*.12,deepen(c,dp,0),R(0,45),{th:.5,rim:.85,rw:1.2});
  const M=o.n||30;for(let i=0;i<M;i++){const u=i/M,r=Rr*.5*Math.pow(1-u,.85)+R(-1.5,1.5),a=i*137.508+R(-20,20),w=Rr*(.12+.24*(1-u))*R(.85,1.15);
    cresc(k,w,w*R(.3,.42),deepen(c,dp,.12+u*.55),{tr:`translate(${f(Math.cos(a*D)*r)},${f(Math.sin(a*D)*r)}) rotate(${f(a+90+R(-28,28))})`,th:.62,rim:.85,rw:1})}
  if(o.button)E('circle',{r:f(Rr*.09),fill:rad([[0,lt(o.button,.3)],[1,dk(o.button,.35)]],.4,.35,.7)},k);

/* ---------- ranunculus: tight concentric layers of tissue-thin petals, optional green eye ---------- */
function xRanunc(g,t,o){const c=o.c||tones('#f07a3a'),Rr=o.R||32,k=G(g),dp=o.deep||dk(c[1],.35);

  const K=o.rings||10;for(let r=0;r<K;r++){const u=r/K,r0=Rr*.8*Math.pow(1-u,1.05),n=Math.max(5,Math.round(10-r*.5)),w=2*Math.PI*r0/n*.78;

/* ---------- decorative dahlia: creased pointed petals in golden-angle whorls, cupped centre ---------- */
function xDahlia(g,t,o){const c=o.c||tones('#8e1a3a'),Rr=o.R||46,k=G(g),N=o.n||64,dp=o.deep||c[0];
  E('circle',{r:f(Rr*.7),fill:rad([[0,dp],[1,c[1]]])},k);
  const P=[];for(let i=0;i<N;i++)P.push({u:Math.sqrt((i+.5)/N),a:i*137.508+R(-4,4)});P.sort((a,b)=>b.u-a.u);
  const pt={prof:sinP(.62,.1),tip:'point',v:1,vo:.4,vw:.6,cup:1,sh:1,base:.55,bl:.4,rim:.55,rs:.5,rw:.9,so:.45};
  for(const p of P){const L=Rr*(.22+.78*p.u)*R(.93,1.04);
    if(p.u>.4){const cc=p.u>.75?c:[c[0],mix(c[1],dp,.2),mix(c[2],c[1],.2),c[3],c[4]];pp(k,L,L*(.3+.08*(1-p.u)),cc,Object.assign({},pt,{tr:`rotate(${f(p.a+90)}) translate(0,${f(-Rr*.1*p.u)})`,bend:R(-.06,.06)}))}
    else{const r0=Rr*p.u*.85,w=L*.42;cresc(k,w,w*.42,deepen(c,dp,.25+(.4-p.u)),{tr:`translate(${f(Math.cos(p.a*D)*r0)},${f(Math.sin(p.a*D)*r0)}) rotate(${f(p.a+90)})`,th:.5,rim:.8,rw:.8})}}
  open(k,t,1100,22,.25)}

/* ---------- carnation: frilled fan petals with toothed rims, optional picotee edge ---------- */
function fanD(L,W,nt){let d=`M0,0C${f(W*.2)},${f(-L*.2)} ${f(W*.6)},${f(-L*.5)} ${f(W)},${f(-L*.84)}`;
  for(let i=0;i<nt;i++){const x0=W-2*W*(i+.5)/nt+R(-.6,.6),x1=W-2*W*(i+1)/nt,ya=-L*(.9+.1*Math.sin(Math.PI*(i+.5)/nt))*R(.94,1.07),yb=-L*(.82+.1*Math.sin(Math.PI*(i+1)/nt))*R(.9,1);
    d+=`L${f(x0)},${f(ya)}L${f(x1)},${f(yb)}`}
  return d+`C${f(-W*.6)},${f(-L*.5)} ${f(-W*.2)},${f(-L*.2)} 0,0Z`}

  open(k,t,950,20,.3)}
