<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belai's Flowers</title>
<meta name="description" content="Maison florale numérique : des bouquets modèles inspirés des plus belles compositions contemporaines, ou ton bouquet fleur par fleur, offerts en un lien.">
<meta name="theme-color" content="#efe9e1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Art direction: plaster walls, concrete plinths, ink and wine — the vocabulary of the reference bouquets */
:root{--bg:#efe9e1;--bg2:#e6ded3;--paper:#f8f4ee;--ink:#1d1916;--ink2:#6e625a;--ink3:#9a8e85;--wine:#6d1028;--wine2:#8e1a3a;--blush:#ecc9c0;--gold:#a8834e;--line:rgba(29,25,22,.12);--line2:rgba(29,25,22,.22);
--r-com:#7f9470;--r-rare:#6f86b8;--r-pre:#93609f;--r-leg:linear-gradient(90deg,#a8834e,#e8c98a,#a8834e);
--f-serif:"Instrument Serif","Cormorant Garamond",Georgia,serif;--f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
input,textarea{user-select:text;-webkit-user-select:text}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:linear-gradient(180deg,#f2ece4,#e8e0d5);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 6px}
.brand{display:flex;align-items:baseline;gap:7px;white-space:nowrap;line-height:1}
.brand em{font-family:var(--f-serif);font-size:27px;font-style:italic;letter-spacing:-.01em}
.brand span{font-size:10px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--ink2)}
.pill{display:flex;align-items:center;gap:8px;background:var(--ink);color:#f6f1ea;border-radius:999px;padding:6px 14px 6px 10px;font-size:13px;min-height:40px;box-shadow:0 2px 0 rgba(29,25,22,.14);white-space:nowrap}
/* lists fade out under the header instead of being cut by it */
.view,.lbody{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16px);mask-image:linear-gradient(180deg,transparent 0,#000 16px)}
.pill svg{width:20px;height:20px;color:#e9c9c0}
.pill b{font-variant-numeric:tabular-nums;font-weight:600}
.pill.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.1)}}
main{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 130px;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .35s,transform .35s}
.view.on{opacity:1;pointer-events:auto;transform:none}
#v-shop{padding:0;overflow:hidden;display:flex;flex-direction:column}
.flab{position:fixed;z-index:71;pointer-events:none;display:flex;gap:7px;align-items:center;background:var(--paper);color:var(--ink);font-size:13px;padding:7px 12px;border-radius:999px;box-shadow:0 10px 24px rgba(29,25,22,.22);white-space:nowrap;font-family:var(--f-serif);font-style:italic;font-size:16px}
.flab b{font-family:var(--f-ui);font-style:normal;font-size:12px;font-weight:600}
.h2{font-family:var(--f-serif);font-size:32px;font-weight:400;font-style:italic;letter-spacing:-.01em;margin:6px 0 12px;text-wrap:balance}
.h3{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);margin:18px 0 9px}
#bq{width:100%;height:100%;display:block;overflow:hidden}
.empty{position:absolute;left:0;right:0;top:20%;text-align:center;color:var(--ink2);font-family:var(--f-serif);font-style:italic;font-size:20px;padding:0 40px;text-wrap:balance}
.occs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px}
.occs::-webkit-scrollbar{display:none}
.oc{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--ink2)}
.oc.on{background:var(--wine);border-color:var(--wine);color:#fbefe9}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 10px}
.sel button{display:flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:13px}
.sel em{font-family:var(--f-serif);font-size:16px;color:var(--wine)}
.sel span{font-weight:600;color:var(--ink3);font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rc)}
.row{display:flex;gap:8px}
.btn2{flex:1;min-height:46px;border-radius:999px;background:transparent;border:1px solid var(--line2);font-weight:500;font-size:14px;padding:0 10px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:54px;border-radius:999px;background:var(--ink);color:#f6f1ea;font-weight:600;font-size:16px;padding:0 22px;box-shadow:0 12px 26px rgba(29,25,22,.22)}
.cta b{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:20px}
.cta[disabled]{background:#cfc6bb;box-shadow:none;cursor:default}
.vases{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.vases::-webkit-scrollbar{display:none}
.vase{flex:none;width:92px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:6px 4px 9px;text-align:center;font-size:12px}
.vase svg{width:100%;height:70px;display:block}
.vase b{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:15px;line-height:1.1;margin-top:2px}.vase small{color:var(--ink2);font-size:11px}
.vase.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vfams{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px 2px}.vfams .oc{min-height:32px;font-size:12.5px}
.vwhy{font-family:var(--f-serif);font-style:italic;font-size:15.5px;line-height:1.3;color:var(--ink2);margin:10px 2px 0;min-height:2.6em;text-wrap:pretty}
.sum{margin:16px 0;padding:14px 16px;border-radius:18px;background:var(--paper);border:1px solid var(--line);font-size:14px;display:grid;gap:7px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:8px}
.sum .t{border-top:1px solid var(--line);padding-top:9px;font-size:15px}.sum .t b{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:22px}
.sum .warn{color:var(--wine);font-size:13px;font-weight:600}
.fld{display:block;margin-bottom:12px;position:relative}
.fld span{display:block;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);resize:none}
.fld small{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--ink2)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-family:var(--f-serif);font-style:italic;font-size:15px}
.music{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu{position:relative;text-align:left;padding:10px 48px 10px 12px;border-radius:16px;background:var(--paper);border:1px solid var(--line);min-height:62px}
.mu.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mu b{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:17px}.mu small{color:var(--ink2);font-size:12px}
.mu .play{position:absolute;right:8px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#f6f1ea;display:grid;place-items:center;font-size:11px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:74px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;padding:0 4px 6px;background:rgba(246,241,234,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center;font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:.02em}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--wine)}.tab svg .f{fill:none;transition:fill-opacity .25s}.tab.on svg .f{fill:currentColor;fill-opacity:.16}.tab svg{transition:transform .25s}.tab.on svg{transform:translateY(-1px)}
/* quiet scrollbars: thin, wine-tinted thumb, no track, no arrows */
*{scrollbar-width:thin;scrollbar-color:rgba(109,16,40,.26) transparent}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}::-webkit-scrollbar-thumb{background:rgba(109,16,40,.24);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:rgba(109,16,40,.45)}::-webkit-scrollbar-button{display:none;width:0;height:0}.tab.on::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--wine)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--wine);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-style:normal}
.scrim{position:absolute;inset:0;z-index:55;background:rgba(29,20,15,.36);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:56;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 18px 26px;box-shadow:0 -12px 40px rgba(29,20,15,.2);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .h2{font-size:28px}
.occ{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.occ button{min-height:86px;border-radius:18px;text-align:left;padding:14px;font-family:var(--f-serif);font-style:italic;font-size:21px;color:var(--ink);border:1px solid var(--line)}
.demo{display:inline-block;background:#efe3c8;color:#5a4318;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;margin:12px 0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--wine)}
.share{display:grid;gap:8px;margin:14px 0}
.sh{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:600;text-decoration:none;color:#f6f1ea;background:var(--ink);font-size:15px}
.sh.wa{background:#25d366;color:#053a1d}
.ok{width:64px;height:64px;border-radius:50%;background:#e7efe2;color:#3d6a35;display:grid;place-items:center;font-size:30px;margin:4px auto 10px}
.center{text-align:center}
.linkbox{width:100%;font:inherit;font-size:13px;padding:10px;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.ov{position:absolute;inset:0;z-index:50;display:none;overflow:hidden;background:radial-gradient(ellipse 90% 70% at 50% 30%,#f7f2eb,#e2d8ca 80%)}
.ov.on{display:block;animation:ovin .35s ease-out}
@keyframes ovin{from{opacity:0}}
.ovtop{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:10px;padding:8px 12px;font-family:var(--f-serif);font-style:italic;font-size:19px}
.ovtop .x{width:42px;height:42px;border-radius:50%;background:rgba(248,244,238,.9);border:1px solid var(--line);font-size:16px;flex:none;font-family:var(--f-ui);font-style:normal}
#ovBq{position:absolute;left:0;top:50px;width:100%;height:calc(100% - 250px);z-index:1;overflow:hidden}
.hz{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.env{position:absolute;left:50%;top:40%;z-index:4;display:grid;justify-items:center;gap:10px;font-family:var(--f-serif);font-style:italic;font-size:21px;transform:translate(-50%,-50%);animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 8px))}}
.env svg{width:156px;height:112px;filter:drop-shadow(0 14px 22px rgba(60,20,20,.22))}
.env small{font-family:var(--f-ui);font-style:normal;font-size:13px;color:var(--ink2)}
.card{position:absolute;left:16px;right:16px;bottom:86px;z-index:3;max-height:calc(100% - 340px);min-height:110px;overflow:auto;background:var(--paper);border-radius:20px;padding:14px 20px;box-shadow:0 16px 36px rgba(29,20,15,.16);opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}
.card.show{opacity:1;transform:none}
.card .to{font-family:var(--f-serif);font-style:italic;font-size:30px;color:var(--wine);line-height:1.1}
.card .m{font-size:16px;line-height:1.5;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.card .fr{text-align:right;font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--ink2)}
.ovact{position:absolute;left:16px;right:16px;bottom:16px;z-index:4;display:flex;flex-wrap:wrap;gap:8px}
.ovact .cta{width:auto;flex:2}
.ov.rec .ovact .cta{flex:1 1 100%}
.ov.rec .card{bottom:142px;max-height:calc(100% - 400px)}
.toast{position:absolute;left:50%;top:58px;z-index:80;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--ink);color:#f6f1ea;border-radius:14px;padding:10px 14px;font-size:14px;transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#f2c2b6;font-weight:600;min-height:32px}
.h{position:absolute;left:0;top:0;will-change:transform}
.h i{display:block;width:100%;height:100%;animation:hsw var(--sw) ease-in-out infinite alternate}
.h svg{display:block;width:100%;height:100%;animation:hfl var(--fl) linear infinite}
@keyframes hsw{from{transform:translateX(calc(var(--a) * -1)) rotate(-16deg)}to{transform:translateX(var(--a)) rotate(16deg)}}
@keyframes hfl{to{transform:rotateY(360deg)}}
/* home: the signature bouquet composes itself on a plinth */
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- catalogue: toolbar, sections, cards ---------- */
.tb{display:flex;gap:8px;align-items:center;padding:6px 16px 10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px;background:var(--paper)}
.seg button{min-height:32px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#f6f1ea}
.srch{flex:1;min-width:140px;min-height:38px;border-radius:999px;border:1px solid var(--line2);background:var(--paper);padding:0 14px;font:inherit;font-size:14px;color:var(--ink)}
.occf{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;margin:0}
.occf::-webkit-scrollbar{display:none}
.occf button{flex:none;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--ink2)}
.occf button.on{background:var(--wine);border-color:var(--wine);color:#fbefe9}
.view.cat{padding:4px 0 0}
.cv{padding:0 0 150px}
.fsec{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:9px;padding:10px 16px;background:linear-gradient(180deg,rgba(240,234,226,.97),rgba(240,234,226,.88));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fsec i{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.fsec b{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:22px}.fsec small{color:var(--ink3);font-size:12px;margin-left:auto}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 16px 14px}
.fcard{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:8px 8px 10px;text-align:left;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 240px}
.fcard .art{position:relative;aspect-ratio:4/5;border-radius:12px;background:radial-gradient(ellipse at 50% 38%,#fbf8f3,#ece4d8);overflow:hidden}
.fcard .art svg{position:absolute;inset:0;width:100%;height:100%}
.fcard b{display:block;margin:7px 2px 0;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:16.5px;line-height:1.12;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.papl{margin:16px 2px 8px;font-size:13px;color:var(--ink2)}.papers{display:flex;flex-wrap:wrap;gap:10px;margin:0 2px}
.pap{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:var(--pc);box-shadow:0 0 0 1px rgba(40,20,20,.18);cursor:pointer;padding:0}.pap.on{box-shadow:0 0 0 2px var(--ink)}
.fcard .sens{margin:2px 2px 0;font-family:var(--f-serif);font-style:italic;font-size:14px;line-height:1.15;color:var(--wine);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fcard small em .u{font-weight:400;font-size:11px;color:var(--ink2)}.occh{margin:-2px 16px 12px;font-size:13px;line-height:1.35;color:var(--ink2)}
.why{margin:8px 0 6px;padding-left:18px;font-size:13px;line-height:1.45;color:var(--ink2)}.why li{margin:2px 0}.el .xtra{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:rgba(109,16,40,.08);color:var(--wine);font-size:11px}
.fcard small{display:flex;justify-content:space-between;gap:6px;margin:2px 2px 0;color:var(--ink2);font-size:12px}.fcard small em{font-style:normal;font-weight:600;color:var(--ink);white-space:nowrap}.fcard small span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .add{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:rgba(248,244,238,.92);border:1px solid var(--line2);display:grid;place-items:center;font-size:18px;line-height:1;color:var(--ink)}
.fcard.on{border-color:var(--wine);box-shadow:inset 0 0 0 1px var(--wine)}.fcard.on .add{background:var(--wine);border-color:var(--wine);color:#fff}
.mcard .art{aspect-ratio:3/4;background:radial-gradient(ellipse 85% 70% at 50% 38%,#f7f2ec,#e9e1d6 78%)}
.mcard b{font-size:18px}
.dock{position:absolute;left:12px;right:12px;bottom:84px;z-index:18;transform:translateY(160%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dock.on{transform:none}
/* ---------- model detail and step flow (full-screen layers) ---------- */
.layer{position:absolute;inset:0;z-index:45;display:none;flex-direction:column;background:radial-gradient(ellipse 90% 60% at 50% 30%,#f8f3ec,#e4dace 80%)}
.layer.on{display:flex;animation:ovin .3s ease-out}
.lhd{display:flex;align-items:center;gap:10px;padding:10px 12px 6px;flex:none}
.lhd .x{width:40px;height:40px;border-radius:50%;background:rgba(248,244,238,.92);border:1px solid var(--line);font-size:16px;flex:none}
.lhd h2{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:24px;line-height:1.05;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbq{flex:none;height:min(46vh,400px);width:100%;display:block;overflow:hidden}#flBq{width:calc(100% - 24px);margin:0 12px;border-radius:22px;transition:background .4s}
.ov.dark{color:#f3ece4}.ov.dark .ovtop,.ov.dark .env{color:#f3ece4}.ov.dark .btn2{color:#f3ece4;border-color:rgba(243,236,228,.45)}
.lbody{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 110px}
.lfoot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:12px 16px 16px;background:linear-gradient(180deg,rgba(236,228,216,0),rgba(236,228,216,.96) 30%)}
.lfoot .cta{flex:2}.lfoot .btn2{flex:1;background:var(--paper)}
.bqstat{font-family:var(--f-serif);font-style:italic;font-size:16px;color:var(--ink2);margin:6px 0 2px;text-wrap:balance}
.els{display:grid;gap:7px;margin-top:6px}
.el{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.el svg{width:42px;height:42px;flex:none;border-radius:10px;background:#efe8de}
.el div{flex:1;min-width:0}.el b{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.el small{color:var(--ink2);font-size:12px}
.el button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;font-weight:600}
/* the player's hand on each variety: stems (− n +) and its place from 1 (back) to 10 (front) */
.el.hand{flex-wrap:wrap;row-gap:6px}
.el.hand .ctl{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:0 0 2px 52px}
.el .qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:999px;padding:2px}
.el .qty button{min-height:30px;width:30px;padding:0;border:0;font-size:17px;font-weight:500;line-height:1}
.el .qty b{min-width:26px;text-align:center;font-family:var(--f-ui);font-style:normal;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.el .pos{display:inline-flex;align-items:center;gap:3px}
.el .pos i{font-style:normal;font-size:11px;color:var(--ink3);padding:0 2px}
.el .pos button{min-height:26px;width:24px;padding:0;border-radius:8px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink2)}
.el .pos button.on{background:var(--wine);border-color:var(--wine);color:#fbefe9}
.steps{display:flex;gap:5px;padding:0 16px 8px;flex:none}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line2)}.steps i.on{background:var(--wine)}
.stt{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);padding:0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
.opt{position:relative;min-height:96px;border-radius:18px;background:var(--paper);border:1px solid var(--line);padding:10px 12px;text-align:left;overflow:hidden}
.opt b{display:block;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:18px}.opt small{color:var(--ink2);font-size:12px}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .pv{position:absolute;right:8px;bottom:6px;width:58px;height:44px;opacity:.9}
.occs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px}
.occs::-webkit-scrollbar{display:none}
.oc{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--ink2)}
.oc.on{background:var(--wine);border-color:var(--wine);color:#fbefe9}
/* butterflies and confetti in the reveal */
.bfy{position:absolute;left:0;top:0;width:36px;height:30px;pointer-events:none;will-change:transform;z-index:3}
.bf2{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;z-index:3;transition:opacity .8s}.bf2 svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 3px rgba(40,20,10,.18))}
.bfy svg{width:100%;height:100%;overflow:visible}
.bfy .wl,.bfy .wr{transform-box:fill-box;animation:flap .2s ease-in-out infinite alternate}
.bfy .wl{transform-origin:100% 50%}.bfy .wr{transform-origin:0 50%}
@keyframes flap{to{transform:scaleX(.22)}}
.conf{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
/* garden of bouquets */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 140px}
.bcard{background:var(--paper);border-radius:18px;padding:8px 8px 12px;border:1px solid var(--line);text-align:left;min-width:0}
.bcard .art{aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#f7f2eb,#e4dbce)}.bcard svg{width:100%;height:100%;display:block}
.bcard b{display:block;margin:8px 4px 0;font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bcard small{margin:0 4px;color:var(--ink2);font-size:12px}
.emptyg{padding:40px 30px;text-align:center;font-family:var(--f-serif);font-style:italic;font-size:19px;color:var(--ink2)}
.view.cat{padding:0}
/* sur mon écran : widget, fonds d’écran, vase animé */
.ovtop .wtop{margin-left:auto;height:38px;border-radius:999px;padding:0 14px;background:rgba(248,244,238,.92);border:1px solid var(--line);font-family:var(--f-ui);font-style:normal;font-size:13px;font-weight:600;color:var(--ink);flex:none}
.wsub{margin:-4px 0 12px;color:var(--ink2);font-size:14px}
.wprev{aspect-ratio:1;width:min(100%,42vh);margin:0 auto 4px;border-radius:18px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.wprev svg{width:100%;height:100%;display:block}
.wprev span{font-family:var(--f-serif);font-style:italic;color:var(--ink2);padding:20px;text-align:center}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wbtn{min-height:58px;border-radius:16px;background:var(--paper);border:1px solid var(--line2);display:grid;align-content:center;gap:2px;text-align:left;padding:8px 14px;color:var(--ink);font:inherit}
.wbtn b{font-weight:600;font-size:14px}
.wbtn small{font-size:12px;color:var(--ink2)}
.wbtn[disabled]{opacity:.45;cursor:progress}
.whow{margin:8px 2px 4px;font-size:13px;line-height:1.45;color:var(--ink2)}
.whow summary{cursor:pointer;color:var(--ink);font-weight:500;padding:6px 0}
.whow p{margin:6px 0}
/* ---------- the web version: from 640 px the app takes the whole window (no phone frame), its lists in a centred column;
   from 1024 px a bouquet is drawn large on the left, its card, steps and choices in a column on the right ---------- */
@media (min-width:640px){
  #app{max-width:none}
  .top{padding:14px max(24px,calc(50% - 620px)) 8px}
  .view{padding-left:max(16px,calc(50% - 620px));padding-right:max(16px,calc(50% - 620px))}
  .view.cat{padding-left:max(0px,calc(50% - 636px));padding-right:max(0px,calc(50% - 636px))}
  .fgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .bgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .tabbar{left:50%;right:auto;bottom:16px;width:min(560px,calc(100% - 48px));transform:translateX(-50%);border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 34px rgba(29,20,15,.14)}
  .dock{left:50%;right:auto;bottom:102px;width:min(720px,calc(100% - 48px));transform:translate(-50%,calc(100% + 140px))}
  .dock.on{transform:translateX(-50%)}
  .sheet{left:50%;right:auto;bottom:24px;width:min(640px,calc(100% - 48px));max-height:calc(100% - 48px);border-radius:26px;transform:translate(-50%,calc(100% + 60px))}
  .sheet.on{transform:translateX(-50%)}
}
@media (min-width:1024px){
  #ovBq{left:24px;top:58px;width:calc(100% - 480px);height:calc(100% - 82px)}
  .ov .card,.ov.rec .card{left:auto;right:32px;width:410px;bottom:132px;max-height:calc(100% - 250px)}
  .ovact{left:auto;right:32px;width:410px}
  .env{left:calc(24px + (100% - 480px)/2)}
  .layer.on{display:grid;grid-template-columns:minmax(0,1fr) min(480px,42%);grid-template-rows:auto auto auto minmax(0,1fr)}
  .layer>.lhd{grid-column:1/-1;grid-row:1}
  .layer>.steps{grid-column:2;grid-row:2}
  .layer>.stt{grid-column:2;grid-row:3}
  .layer>.lbq,#fl>#flBq{grid-column:1;grid-row:2/5;width:auto;height:100%;margin:0 12px 24px 24px}
  .layer>.lbody{grid-column:2;grid-row:4;padding:4px 24px 110px 8px}
  .layer>.lfoot{left:auto;width:min(480px,42%)}
}
</style>
</head>

<script>
