<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belai's Flowers</title>
<meta name="description" content="Compose et envoie un bouquet animé unique, fleur par fleur.">
<meta name="theme-color" content="#fff4ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized app shell; shop = two looping shelves, florist stands behind the tab-bar counter */
:root{--bg:#fff4ef;--wall:#fff4ef;--wall2:#ffe4ec;--ink:#3b1830;--ink2:#7a4a66;--berry:#e0336f;--lilac:#efe7ff;--kraft:#ecd0a4;--line:rgba(59,24,48,.12);--card:#fff;
--r-com:#3fa66b;--r-rare:#2f7bff;--r-pre:#9b5cff;--r-leg:linear-gradient(90deg,#ff8a00,#ffc94d,#ff8a00);
--f-brand:"Fraunces",Georgia,serif;--f-ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--f-script:"Great Vibes","Snell Roundhand",cursive;
color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
input,textarea{user-select:text;-webkit-user-select:text}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:linear-gradient(180deg,var(--wall),var(--wall2));overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px){body{display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,#ffe1ea,#f1e9ff 55%,#e3f3ec)}#app{width:400px;height:min(880px,calc(100% - 40px));border-radius:36px;box-shadow:0 30px 80px rgba(80,20,60,.25),0 0 0 10px #fff}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 6px}
.brand{font-family:var(--f-brand);font-size:24px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand em{color:var(--berry)}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;min-height:40px;box-shadow:0 4px 14px rgba(120,30,80,.08);white-space:nowrap}
.pill svg{width:22px;height:22px;color:var(--berry)}
.pill b{font-variant-numeric:tabular-nums}
.pill.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.14)}}
main{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 130px;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .35s,transform .35s}
.view.on{opacity:1;pointer-events:auto;transform:none}
#v-shop{padding:0;overflow:hidden;display:flex;flex-direction:column}
.gw{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:26px 26px 0 0;background:#0b2a22;touch-action:pan-y;cursor:grab;outline:none}
.gw:focus-visible{box-shadow:inset 0 0 0 3px var(--berry)}
.gl{position:absolute;inset:0}
.gl svg{position:absolute;left:0;top:0;will-change:transform;overflow:visible}
.gfront{pointer-events:none}
.pk{cursor:pointer;transform-box:fill-box;transform-origin:50% 85%}
.pk.picked{animation:regrow 1.7s cubic-bezier(.3,.7,.3,1)}
@keyframes regrow{0%{transform:scale(1)}10%{transform:scale(1.14)}24%{transform:scale(.02);opacity:0}25%{opacity:1}100%{transform:scale(1)}}
.zt{font-family:var(--f-brand);font-style:italic;font-weight:600;font-size:46px;fill:#fff;fill-opacity:.92;stroke:rgba(0,0,0,.35);stroke-width:5px;paint-order:stroke}
.vig{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse 85% 75% at 50% 45%,transparent 55%,rgba(0,12,8,.45))}
.grain{position:absolute;inset:0;pointer-events:none;z-index:3;mix-blend-mode:soft-light;opacity:.2}
.ghint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;max-width:calc(100% - 24px);font-size:12.5px;font-weight:700;color:#fff;background:rgba(8,28,22,.62);padding:7px 12px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .6s}
.flab{position:fixed;z-index:71;pointer-events:none;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.96);color:var(--ink);font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.28);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 8px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;min-height:38px;padding:0 12px 0 8px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:650}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.shop{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly}
.shelf{position:relative;height:clamp(196px,31vh,250px);overflow:hidden;touch-action:pan-y;cursor:grab}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:20px;height:16px;background:linear-gradient(180deg,#e2b07a,#c0844d 55%,#9c6336);box-shadow:0 9px 14px rgba(90,40,10,.22)}
.lbl{position:absolute;left:16px;top:2px;z-index:2;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.track{position:absolute;left:0;bottom:28px;display:flex;will-change:transform;z-index:1}
.it{position:relative;width:118px;height:clamp(170px,27vh,222px);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.it svg.fl{width:118px;flex:1;min-height:0;overflow:visible;pointer-events:none}
.it.pop svg.fl{animation:pop .45s}
@keyframes pop{40%{transform:translateY(-8px) scale(1.07)}}
.bucket{flex:none;width:60px;height:42px;margin-top:-14px;clip-path:polygon(4% 0,96% 0,84% 100%,16% 100%);background:linear-gradient(90deg,#8e98a3,#eef2f5 34%,#b9c1c9 62%,#87909a)}
.tag{position:absolute;bottom:2px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--kraft);padding:3px 8px 3px 14px;border-radius:5px;font-size:11px;line-height:1.15;box-shadow:0 2px 5px rgba(80,40,0,.18);white-space:nowrap;text-align:center;pointer-events:none}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--wall)}
.tag i{display:block;font-style:normal;font-weight:600}
.tag b{font-size:13px;font-variant-numeric:tabular-nums}
.rar{position:absolute;top:22px;left:8px;z-index:2;font-size:10px;font-weight:800;letter-spacing:.03em;padding:2px 6px;border-radius:6px;color:#fff;background:var(--rc);pointer-events:none}
.r-c{--rc:var(--r-com)}.r-r{--rc:var(--r-rare)}.r-p{--rc:var(--r-pre)}.r-l{--rc:var(--r-leg);color:#4a2600}
.it.leg::before{content:"";position:absolute;left:8%;right:8%;top:14%;height:58%;background:radial-gradient(circle,rgba(255,206,90,.6),transparent 66%);animation:glow 2.6s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{from{opacity:.35;transform:scale(.92)}to{opacity:1;transform:scale(1.05)}}
.swipehint{flex:none;text-align:center;font-size:13px;color:var(--ink2);padding:0 0 4px}
.none{position:absolute;inset:40% 16px auto;text-align:center;color:var(--ink2);font-size:14px}
.h2{font-family:var(--f-brand);font-size:28px;font-weight:600;letter-spacing:-.01em;margin:6px 0 12px;text-wrap:balance}
.h3{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:16px 0 8px}
#bqwrap{position:relative;height:min(46vh,400px);margin:0 -16px}
#bq{width:100%;height:100%;display:block;overflow:visible}
.empty{position:absolute;left:0;right:0;top:26%;text-align:center;color:var(--ink2);font-size:15px;padding:0 40px;text-wrap:balance}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.sel button{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px}
.sel span{font-weight:800;color:var(--berry);font-size:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rc)}
.row{display:flex;gap:8px}
.btn2{flex:1;min-height:48px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:15px;padding:0 10px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:56px;border-radius:18px;background:var(--berry);color:#fff;font-weight:800;font-size:17px;padding:0 18px;box-shadow:0 10px 24px rgba(224,51,111,.32)}
.cta[disabled]{background:#d9c3ce;box-shadow:none;cursor:default}
.vases{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.vase{flex:none;width:86px;border-radius:16px;background:#fff;border:2px solid var(--line);padding:6px 4px 8px;text-align:center;font-size:12px}
.vase svg{width:100%;height:58px;display:block}
.vase b{display:block;font-size:12px}.vase small{color:var(--ink2)}
.vase.on{border-color:var(--berry);background:#fff3f7}
.sum{margin:14px 0;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:14px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:8px}
.sum .t{border-top:1px dashed var(--line);padding-top:8px;font-size:16px}
.sum .warn{color:var(--berry);font-size:13px;font-weight:700}
.fld{display:block;margin-bottom:12px;position:relative}
.fld span{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.fld input,.fld textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);resize:none}
.fld small{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--ink2)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{min-height:36px;padding:0 12px;border-radius:999px;background:var(--lilac);font-size:13px;font-weight:600}
.music{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu{position:relative;text-align:left;padding:10px 48px 10px 12px;border-radius:16px;background:#fff;border:2px solid var(--line);min-height:62px}
.mu.on{border-color:var(--berry);background:#fff3f7}
.mu b{display:block;font-size:14px}.mu small{color:var(--ink2);font-size:12px}
.mu .play{position:absolute;right:8px;top:50%;margin-top:-17px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px}
.herb{background:#fff;border-radius:18px;padding:14px;border:1px solid var(--line);font-size:15px}
.herb .bar{height:10px;border-radius:5px;background:#f6e4ec;margin-top:10px;overflow:hidden}
.herb .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7aa8,#ffb020);border-radius:5px;transition:width .8s}
.garden{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.gcard{background:#fff;border-radius:18px;padding:8px 8px 12px;border:1px solid var(--line);text-align:left;min-width:0}
.gcard svg{width:100%;aspect-ratio:840/700;display:block;background:linear-gradient(180deg,#fff7f2,#ffe9f0);border-radius:12px}
.gcard b{display:block;margin:8px 4px 0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gcard small{margin:0 4px;color:var(--ink2);font-size:12px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:74px;z-index:20;display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;align-items:end;padding:0 4px 6px;background:rgba(255,250,247,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2)}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--berry)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--berry);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-style:normal}
.florist{position:absolute;left:50%;bottom:50px;width:100px;height:125px;margin-left:-50px;z-index:19}
.florist svg{width:100%;height:100%;overflow:visible}
.fl-svg .head{transform-box:fill-box;transform-origin:50% 92%;animation:tilt 6s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}62%{transform:rotate(4deg)}}
.fl-svg .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.fl-svg .arm{transform-box:fill-box;transform-origin:8% 95%;animation:sway 3.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
.florist.wave .arm{animation:wave .45s ease-in-out 4 alternate}
@keyframes wave{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
.fl-svg .body{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(1.2px)}}
.bubble{position:absolute;left:50%;bottom:180px;z-index:21;width:max-content;max-width:min(260px,calc(100% - 40px));transform:translate(-50%,8px) scale(.96);opacity:0;pointer-events:none;background:#fff;color:var(--ink);border-radius:16px;padding:10px 13px;font-size:13.5px;font-weight:600;line-height:1.35;box-shadow:0 10px 28px rgba(90,20,60,.18);transition:opacity .3s,transform .3s;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;margin-left:-7px;background:#fff;transform:rotate(45deg);border-radius:2px}
.bubble.show{opacity:1;transform:translate(-50%,0)}
.scrim{position:absolute;inset:0;z-index:39;background:rgba(40,10,30,.36);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;max-height:88%;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 18px 26px;box-shadow:0 -12px 40px rgba(60,10,40,.2);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .h2{font-size:24px}
.occ{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.occ button{min-height:86px;border-radius:18px;text-align:left;padding:14px;font-size:16px;font-weight:800;color:var(--ink)}
.demo{display:inline-block;background:#fff3c4;color:#6e5100;font-size:12px;font-weight:800;padding:4px 8px;border-radius:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;margin:12px 0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--berry)}
.share{display:grid;gap:8px;margin:14px 0}
.sh{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;font-weight:800;text-decoration:none;color:#fff;background:var(--ink);font-size:16px}
.sh.wa{background:#25d366;color:#053a1d}
.ok{width:64px;height:64px;border-radius:50%;background:#e6f7ee;color:#1c8c55;display:grid;place-items:center;font-size:30px;margin:4px auto 10px}
.center{text-align:center}
.linkbox{width:100%;font:inherit;font-size:13px;padding:10px;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.ov{position:absolute;inset:0;z-index:50;display:none;overflow:hidden;background:linear-gradient(180deg,#fff6f1 0%,#ffe4ee 55%,#ebe6ff 100%)}
.ov.on{display:block;animation:ovin .35s ease-out}
@keyframes ovin{from{opacity:0}}
.ovtop{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:10px;padding:6px 12px;font-weight:700;font-size:15px}
.ovtop .x{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);font-size:18px;flex:none}
#ovBq{position:absolute;left:0;top:50px;width:100%;height:calc(100% - 250px);z-index:1;overflow:visible}
.hz{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.env{position:absolute;left:50%;top:40%;z-index:4;display:grid;justify-items:center;gap:10px;font-weight:800;font-size:16px;transform:translate(-50%,-50%);animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,calc(-50% - 8px))}}
.env svg{width:156px;height:112px;filter:drop-shadow(0 12px 20px rgba(150,30,80,.25))}
.env small{font-weight:600;color:var(--ink2)}
.card{position:absolute;left:16px;right:16px;bottom:86px;z-index:3;max-height:calc(100% - 340px);min-height:110px;overflow:auto;background:#fffaf6;border-radius:20px;padding:12px 18px;box-shadow:0 14px 34px rgba(120,30,70,.18);opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}
.card.show{opacity:1;transform:none}
.card .to{font-family:var(--f-script);font-size:32px;color:var(--berry);line-height:1.1}
.card .m{font-size:16px;line-height:1.45;margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.card .fr{text-align:right;font-family:var(--f-script);font-size:25px;color:var(--ink2)}
.ovact{position:absolute;left:16px;right:16px;bottom:16px;z-index:4;display:flex;flex-wrap:wrap;gap:8px}
.ovact .cta{width:auto;flex:2}
.ov.rec .ovact .cta{flex:1 1 100%}
.ov.rec .card{bottom:142px;max-height:calc(100% - 400px)}
.toast{position:absolute;left:50%;top:58px;z-index:80;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;transition:opacity .3s,transform .3s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#ffb3cc;font-weight:800;min-height:32px}
.h{position:absolute;left:0;top:0;will-change:transform}
.h i{display:block;width:100%;height:100%;animation:hsw var(--sw) ease-in-out infinite alternate}
.h svg{display:block;width:100%;height:100%;animation:hfl var(--fl) linear infinite}
@keyframes hsw{from{transform:translateX(calc(var(--a) * -1)) rotate(-16deg)}to{transform:translateX(var(--a)) rotate(16deg)}}
@keyframes hfl{to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div id="app">
 <header class="top">
  <div class="brand">Belai's <em>Flowers</em></div>
  <button class="pill" id="pill" type="button" aria-label="Voir mon bouquet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22l-5-9h10z"/><circle cx="9" cy="8" r="2.6"/><circle cx="15" cy="8" r="2.6"/><circle cx="12" cy="4.6" r="2.6"/></svg><span><span id="pillN">0</span> <span id="pillW">fleur</span></span><b id="pillT">0,00 €</b></button>
 </header>
 <main>
  <section class="view on" id="v-shop" aria-label="Le jardin">
   <div class="chips" id="chips" role="tablist" aria-label="Allées de couleur"></div>
   <div class="gw" id="gw" tabindex="0" aria-label="Jardin : glisse pour te promener, touche une fleur pour la cueillir"><div class="gl" id="gFar"></div><div class="gl" id="gMid"></div><div class="gl gfront" id="gFront"></div><div class="vig"></div><div class="grain" id="grain"></div><p class="ghint" id="ghint">Glisse pour te promener · touche une fleur pour la cueillir</p></div>
  </section>
